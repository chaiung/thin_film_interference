<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>薄膜干涉互動模擬（側切面波學干涉）</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        /* 自定義滑桿樣式 */
        input[type=range] {
            accent-color: #0284c7;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-6">

    <!-- 頂部標題與說明 -->
    <header class="w-full max-w-6xl text-center mb-3">
        <h1 class="text-2xl md:text-3xl font-bold text-slate-800">
            薄膜干涉側面光路圖（RGB 三原色）
        </h1>
        <p class="text-slate-600 text-sm mt-1">
            觀察不同入射角度下，紅、綠、藍三原色光於薄膜表面的干涉強度變化。
        </p>
    </header>

    <!-- 將參數與控制面板移至頂部橫向排列 -->
    <div class="w-full max-w-6xl bg-white border border-slate-200 p-4 rounded-2xl shadow-sm mb-4 flex flex-col md:flex-row items-center justify-between gap-4">
        <!-- 入射角控制區 -->
        <div class="flex items-center gap-3 w-full md:w-72">
            <label for="angleRange" class="text-sm font-medium text-slate-700 whitespace-nowrap">入射角度 (&theta;<sub>i</sub>)</label>
            <input type="range" id="angleRange" min="10" max="75" value="45" class="w-full cursor-pointer h-2 bg-slate-200 rounded-lg">
            <span id="angleVal" class="text-sm font-mono font-bold text-sky-600 w-10 text-right">45°</span>
        </div>

        <!-- 資訊區與三原色波長 -->
        <div class="flex flex-wrap items-center gap-3 text-xs text-slate-600 w-full md:w-auto justify-end">
            <div class="flex gap-3 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-xl">
                <span>薄膜厚度: <strong class="text-slate-800 font-mono">450 nm</strong></span>
                <span class="border-l border-slate-300 pl-3">折射率 (n<sub>2</sub>): <strong class="text-slate-800 font-mono">1.40</strong></span>
            </div>
            <div class="flex gap-1.5 font-mono">
                <div class="px-2.5 py-1 rounded bg-red-50 text-red-700 border border-red-200 font-bold">
                    紅 650 nm
                </div>
                <div class="px-2.5 py-1 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold">
                    綠 532 nm
                </div>
                <div class="px-2.5 py-1 rounded bg-sky-100 text-blue-700 border border-blue-300 font-bold">
                    藍 450 nm
                </div>
            </div>
        </div>
    </div>

    <!-- 主要內容區：寬螢幕 2D 光學側面圖 -->
    <main class="w-full max-w-6xl flex-grow">
        <section class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden relative flex flex-col items-center justify-center p-2 min-h-[500px]">
            <!-- 觀察者最終合成顏色預覽 -->
            <div class="absolute top-4 right-5 z-10 flex items-center gap-2 bg-white/90 backdrop-blur px-3 py-1.5 rounded-xl border border-slate-200 text-xs text-slate-700 shadow-sm">
                <span>觀察混合色：</span>
                <div id="colorPreview" class="w-6 h-6 rounded-md border border-slate-300 shadow-inner" style="background-color: #ffffff;"></div>
            </div>
            
            <!-- Canvas 畫布容器 -->
            <div id="canvasContainer" class="w-full h-[480px] md:h-[540px] rounded-xl overflow-hidden relative">
                <canvas id="interferenceCanvas" class="w-full h-full"></canvas>
            </div>
        </section>
    </main>

    <!-- 底部說明區 -->
    <footer class="w-full max-w-6xl mt-4 text-center text-xs text-slate-400 border-t border-slate-200 pt-3">
        薄膜側面干涉公式：光程差 &Delta;s = 2 n<sub>2</sub> d cos(&theta;<sub>t</sub>)。
    </footer>

    <!-- JavaScript 模擬核心 -->
    <script>
        // DOM 元素
        const canvas = document.getElementById('interferenceCanvas');
        const ctx = canvas.getContext('2d');
        const angleRange = document.getElementById('angleRange');
        const angleVal = document.getElementById('angleVal');
        const colorPreview = document.getElementById('colorPreview');

        // 固定參數
        const FIXED_THICKNESS = 450; // 固定膜厚 450nm
        const FIXED_N1 = 1.0;        // 空氣折射率
        const FIXED_N2 = 1.40;       // 薄膜折射率

        // 固定三原色規格（放大畫布波長 drawWL 差異，讓紅光極疏、藍光極密）
        const wavelengths = [
            { name: '紅光', wl: 650, drawWL: 36, color: '#dc2626' },
            { name: '綠光', wl: 532, drawWL: 24, color: '#16a34a' },
            { name: '藍光', wl: 450, drawWL: 15, color: '#2563eb' }
        ];

        // 模擬狀態
        let state = {
            angleDeg: 45
        };

        // 調整畫布高寬
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            render();
        }
        window.addEventListener('resize', resizeCanvas);

        // 事件監聽
        angleRange.addEventListener('input', (e) => {
            state.angleDeg = parseFloat(e.target.value);
            angleVal.innerText = `${state.angleDeg}°`;
            render();
        });

        // 光學計算：干涉強度
        function calcInterference(wlNm, angleDeg) {
            const thetaI = angleDeg * Math.PI / 180;
            const sinThetaT = (FIXED_N1 / FIXED_N2) * Math.sin(thetaI);
            const thetaT = Math.asin(Math.min(1, sinThetaT));

            // 光程差 Δs = 2 * n2 * d * cos(thetaT)
            const OPD = 2 * FIXED_N2 * FIXED_THICKNESS * Math.cos(thetaT);

            // 上表面反射發生 180 度相位突變 (+π)
            const phaseDiff = (2 * Math.PI / wlNm) * OPD + Math.PI;

            // 相干強度 I = cos^2(phaseDiff / 2)
            const intensity = Math.pow(Math.cos(phaseDiff / 2), 2);

            return { intensity, thetaT, phaseDiff };
        }

        // 計算合成混合色
        function computeCombinedColor() {
            let rInt = calcInterference(650, state.angleDeg).intensity;
            let gInt = calcInterference(532, state.angleDeg).intensity;
            let bInt = calcInterference(450, state.angleDeg).intensity;

            const r = Math.round(rInt * 255);
            const g = Math.round(gInt * 255);
            const b = Math.round(bInt * 255);

            return `rgb(${r}, ${g}, ${b})`;
        }

        // 靜態實線波形繪製函式
        function drawSolidWaveRay(startX, startY, endX, endY, waveLength, amplitude, phaseOffset, color, strokeWidth = 2) {
            ctx.save();
            ctx.beginPath();
            ctx.setLineDash([]); 

            const dx = endX - startX;
            const dy = endY - startY;
            const dist = Math.hypot(dx, dy);
            const angle = Math.atan2(dy, dx);

            ctx.translate(startX, startY);
            ctx.rotate(angle);

            ctx.strokeStyle = color;
            ctx.lineWidth = strokeWidth;

            ctx.moveTo(0, 0);
            const steps = Math.floor(dist);
            for (let i = 0; i <= steps; i += 1.5) {
                const x = i;
                const y = Math.sin((i / waveLength) * Math.PI * 2 - phaseOffset) * amplitude;
                ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.restore();
        }

        // 渲染側面光學畫面
        function render() {
            const w = canvas.width;
            const h = canvas.height;

            // 清空畫布為淺色背景
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, w, h);

            // 定義側面介質邊界
            const filmTopY = h * 0.48;
            const visualThickness = 65; 
            const filmBottomY = filmTopY + visualThickness;

            // 繪製薄膜淺色塗層
            ctx.fillStyle = 'rgba(224, 242, 254, 0.7)';
            ctx.fillRect(0, filmTopY, w, visualThickness);

            // 薄膜上下邊界線
            ctx.strokeStyle = '#0284c7';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, filmTopY);
            ctx.lineTo(w, filmTopY);
            ctx.stroke();

            ctx.strokeStyle = '#0369a1';
            ctx.beginPath();
            ctx.moveTo(0, filmBottomY);
            ctx.lineTo(w, filmBottomY);
            ctx.stroke();

            // 光學幾何計算：將水平間距 spacing 拉大至 w / 3.6
            const thetaI = state.angleDeg * Math.PI / 180;
            const spacing = w / 3.6;

            wavelengths.forEach((waveItem, idx) => {
                // 加大每組光束的 X 座標分佈，從畫布兩側與中間均勻分開
                const surfacePointX = spacing * (idx + 0.8);
                const surfacePointY = filmTopY;

                // 入射光路徑
                const inLength = 110;
                const incidentStartX = surfacePointX - inLength * Math.sin(thetaI);
                const incidentStartY = surfacePointY - inLength * Math.cos(thetaI);

                // 薄膜內折射
                const { intensity, thetaT, phaseDiff } = calcInterference(waveItem.wl, state.angleDeg);
                
                const bottomPointX = surfacePointX + visualThickness * Math.tan(thetaT);
                const bottomPointY = filmBottomY;

                const exitPointX = bottomPointX + visualThickness * Math.tan(thetaT);
                const exitPointY = filmTopY;

                // 反射光路徑（縮短出射光長度使兩路干涉交會）
                const refLength1 = 110;
                const refEndX1 = surfacePointX + refLength1 * Math.sin(thetaI);
                const refEndY1 = surfacePointY - refLength1 * Math.cos(thetaI);

                const refLength2 = 55; 
                const refEndX2 = exitPointX + refLength2 * Math.sin(thetaI);
                const refEndY2 = exitPointY - refLength2 * Math.cos(thetaI);

                // 畫虛線法線 Normal Line
                ctx.save();
                ctx.setLineDash([3, 3]);
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(surfacePointX, surfacePointY - 45);
                ctx.lineTo(surfacePointX, surfacePointY + visualThickness + 15);
                ctx.stroke();
                ctx.restore();

                // 波長比例 (介質內波長 = 空氣波長 / n2)
                const airWL = waveItem.drawWL;
                const filmWL = waveItem.drawWL / FIXED_N2;

                // 1. 入射光波
                drawSolidWaveRay(incidentStartX, incidentStartY, surfacePointX, surfacePointY, airWL, 3.5, 0, waveItem.color, 2);

                // 2. 上表面反射光
                drawSolidWaveRay(surfacePointX, surfacePointY, refEndX1, refEndY1, airWL, 3.5, Math.PI, waveItem.color, 2);

                // 3. 薄膜內折射光波
                drawSolidWaveRay(surfacePointX, surfacePointY, bottomPointX, bottomPointY, filmWL, 3, 0, waveItem.color, 1.8);

                // 4. 底面反射光波
                drawSolidWaveRay(bottomPointX, bottomPointY, exitPointX, exitPointY, filmWL, 3, 0.5, waveItem.color, 1.8);

                // 5. 二次折射出射光
                drawSolidWaveRay(exitPointX, exitPointY, refEndX2, refEndY2, airWL, 3.5, phaseDiff, waveItem.color, 2);

                // --- 6. 在兩道反射波最前方加入干涉相位標記點 ---
                // 第一道反射光前端點
                ctx.beginPath();
                ctx.arc(refEndX1, refEndY1, 4.5, 0, Math.PI * 2);
                ctx.fillStyle = waveItem.color;
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // 第二道反射光前端點（根據干涉強度呈現亮暗脈衝狀態）
                ctx.beginPath();
                ctx.arc(refEndX2, refEndY2, 4.5, 0, Math.PI * 2);
                ctx.fillStyle = waveItem.color;
                ctx.globalAlpha = 0.3 + intensity * 0.7; // 加強干涉時完全不透明，相消干涉時偏半透明
                ctx.fill();
                ctx.globalAlpha = 1.0;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // 僅保留干涉強度標示，固定顯示於法線上方
                ctx.fillStyle = waveItem.color;
                ctx.font = '600 13px Inter, sans-serif';
                ctx.textAlign = 'center';
                const percent = Math.round(intensity * 100);
                ctx.fillText(`強度: ${percent}%`, surfacePointX, surfacePointY - 50);
            });

            // 更新右上角混合干涉色彩
        const finalColorStr = computeCombinedColor();
        colorPreview.style.backgroundColor = finalColorStr;
        colorPreview.style.boxShadow = `0 0 10px ${finalColorStr}`;
    }

    // 畫布初始化與防護渲染（解決初次載入空白問題）
    function init() {
        resizeCanvas();
        // 額外延遲觸發一次，確保 Tailwind CSS 與字型完全載入後畫布尺寸精確
        setTimeout(resizeCanvas, 50);
        setTimeout(resizeCanvas, 300);
    }

    if (document.readyState === 'complete') {
        init();
    } else {
        window.addEventListener('load', init);
        document.addEventListener('DOMContentLoaded', init);
    }
    </script>
</body>
</html>
